# Activation-only path for previously published, immutable bridge artifacts.
# Verification and promotion policy mirror release.yml; signing remains isolated.
name: Activate verified ZTC release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        type: choice
        required: true
        default: preview
        options:
          - preview
          - stable
      version:
        description: Strict SemVer without a v prefix
        type: string
        required: true
      source_sha:
        description: Exact 40-character Epoch-ML/zerg commit SHA
        type: string
        required: true

concurrency:
  group: zterm-desktop-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate immutable request
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      channel: ${{ steps.request.outputs.channel }}
      release_tag: ${{ steps.request.outputs.release_tag }}
      requested_at: ${{ steps.request.outputs.requested_at }}
      release_target_sha: ${{ steps.request.outputs.release_target_sha }}
      source_ref: ${{ steps.request.outputs.source_ref }}
      source_sha: ${{ steps.request.outputs.source_sha }}
      version: ${{ steps.request.outputs.version }}
      npm_version: ${{ steps.request.outputs.npm_version }}
      npm_integrity: ${{ steps.request.outputs.npm_integrity }}
      npm_tarball: ${{ steps.request.outputs.npm_tarball }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install and audit locked release policy dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit --audit-level=moderate

      - name: Test release policy
        run: npm test

      - id: request
        name: Resolve and validate exactly one request
        env:
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
          INPUT_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          request_path="$RUNNER_TEMP/release-request.json"

          if [[ "$GITHUB_REPOSITORY" != "Epoch-ML/ztc-releases" || "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::public releases must be dispatched from protected main"
            exit 1
          fi
          if [[ "$INPUT_CHANNEL" == "stable" ]]; then
            release_tag="ztc-desktop-v${INPUT_VERSION}"
          elif [[ "$INPUT_CHANNEL" == "preview" ]]; then
            release_tag="ztc-desktop-preview-v${INPUT_VERSION}"
          else
            echo "::error::release channel must be preview or stable"
            exit 1
          fi
          candidate="requests/${release_tag}.json"
          if [[ -L "$candidate" || ! -f "$candidate" ]]; then
            echo "::error::release dispatch requires the existing immutable $candidate"
            exit 1
          fi

          if [[ ! "$candidate" =~ ^requests/[0-9A-Za-z._+-]+\.json$ || -L "$candidate" || ! -f "$candidate" ]]; then
            echo "::error::the request must be one regular non-symlink requests/*.json file"
            exit 1
          fi
          mapfile -t addition_commits < <(
            git log --format=%H --diff-filter=A -- "$candidate"
          )
          if [[ ${#addition_commits[@]} -ne 1 ]]; then
            echo "::error::the request must have exactly one immutable addition commit"
            exit 1
          fi
          request_commit="${addition_commits[0]}"
          git merge-base --is-ancestor "$request_commit" "$GITHUB_SHA"
          read -r -a commit_and_parents <<<"$(git rev-list --parents -n 1 "$request_commit")"
          if [[ ${#commit_and_parents[@]} -ne 2 ]]; then
            echo "::error::the request addition must be a single-parent commit"
            exit 1
          fi
          mapfile -d '' -t addition_changes < <(
            git diff --name-status --no-renames -z \
              "${request_commit}^" "$request_commit"
          )
          if [[
            ${#addition_changes[@]} -ne 2 ||
            "${addition_changes[0]}" != "A" ||
            "${addition_changes[1]}" != "$candidate"
          ]]; then
            echo "::error::the request addition commit must add only this request"
            exit 1
          fi
          request_mode="$(git ls-tree "$request_commit" -- "$candidate" | cut -d ' ' -f 1)"
          if [[ "$request_mode" != "100644" ]]; then
            echo "::error::the immutable request must be a normal non-executable file"
            exit 1
          fi
          addition_bytes="$RUNNER_TEMP/zterm-request-at-addition.json"
          git show "${request_commit}:$candidate" >"$addition_bytes"
          cmp --silent "$candidate" "$addition_bytes" || {
            echo "::error::request bytes changed after their immutable addition commit"
            exit 1
          }

          node scripts/release-request.mjs "$candidate" >"$request_path"
          jq -e \
            --arg channel "$INPUT_CHANNEL" \
            --arg version "$INPUT_VERSION" \
            --arg source_sha "$INPUT_SOURCE_SHA" \
            '.channel == $channel and .version == $version and .source_sha == $source_sha' \
            "$request_path" >/dev/null || {
              echo "::error::dispatch inputs do not exactly match the immutable request"
              exit 1
            }

          release_tag="$(jq -r .release_tag "$request_path")"
          if [[ "$candidate" != "requests/${release_tag}.json" ]]; then
            echo "::error::request filename must be requests/${release_tag}.json"
            exit 1
          fi
          remote_refs="$(
            git ls-remote --tags origin \
              "refs/tags/$release_tag" "refs/tags/$release_tag^{}"
          )"
          tag_object="$(
            awk -v ref="refs/tags/$release_tag" '$2 == ref { print $1 }' \
              <<<"$remote_refs"
          )"
          tag_commit="$(
            awk -v ref="refs/tags/$release_tag^{}" '$2 == ref { print $1 }' \
              <<<"$remote_refs"
          )"
          if [[ -n "$tag_commit" ]]; then
            tag_target="$tag_commit"
          else
            tag_target="$tag_object"
          fi
          if [[ -z "$tag_target" ]]; then
            echo "::error::public release tag $release_tag does not exist"
            exit 1
          fi
          if [[ "$tag_target" != "$request_commit" ]]; then
            echo "::error::public release tag must point to the immutable request addition commit"
            exit 1
          fi
          {
            echo "release_target_sha=$request_commit"
            echo "npm_version=$(jq -r .npm.version "$request_path")"
            echo "npm_integrity=$(jq -r .npm.integrity "$request_path")"
            echo "npm_tarball=$(jq -r .npm.tarballUrl "$request_path")"
          } >>"$GITHUB_OUTPUT"
          for field in channel release_tag requested_at source_ref source_sha version; do
            printf '%s=%s\n' "$field" "$(jq -r ".$field" "$request_path")" \
              >>"$GITHUB_OUTPUT"
          done

  verify-artifacts:
    name: Verify immutable signed release assets
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          path: index
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.23.2"

      - name: Install pinned updater signature verifier
        shell: bash
        run: |
          set -euo pipefail
          verifier_archive="$RUNNER_TEMP/minisign-0.12-linux.tar.gz"
          verifier_root="$RUNNER_TEMP/zterm-release-tools"
          mkdir -p "$verifier_root"
          curl --fail --location --silent --show-error \
            --retry 3 --retry-all-errors \
            --proto '=https' --proto-redir '=https' --tlsv1.2 \
            https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-linux.tar.gz \
            --output "$verifier_archive"
          echo \
            "9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73  $verifier_archive" \
            | sha256sum -c -
          tar -xzf "$verifier_archive" -C "$verifier_root"
          install -m 755 \
            "$verifier_root/minisign-linux/x86_64/minisign" \
            "$verifier_root/minisign"
          [[ "$("$verifier_root/minisign" -v 2>&1)" == *"0.12"* ]]
          echo "$verifier_root" >>"$GITHUB_PATH"

      - name: Verify the existing immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHANNEL: ${{ needs.validate.outputs.channel }}
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
          RELEASE_TARGET_SHA: ${{ needs.validate.outputs.release_target_sha }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          fetch_exact_release() {
            local output_path="$1"
            local max_release_pages=100
            local max_release_lookup_attempts=12
            local release_lookup_delay_seconds=5
            local lookup_attempt page page_count page_json matches_json match_count release_id
            matches_json="$RUNNER_TEMP/release-matches.jsonl"
            for ((lookup_attempt = 1; lookup_attempt <= max_release_lookup_attempts; lookup_attempt++)); do
              : >"$matches_json"
              for ((page = 1; page <= max_release_pages; page++)); do
                page_json="$RUNNER_TEMP/releases-page-$page.json"
                gh api \
                  "repos/$GITHUB_REPOSITORY/releases?per_page=100&page=$page" \
                  >"$page_json"
                jq -e 'type == "array" and length <= 100' \
                  "$page_json" >/dev/null
                jq -c --arg tag "$RELEASE_TAG" \
                  '.[] | select(.tag_name == $tag)' "$page_json" \
                  >>"$matches_json"
                page_count="$(jq 'length' "$page_json")"
                if [[ "$page_count" -lt 100 ]]; then
                  break
                fi
                if [[ "$page" -eq "$max_release_pages" ]]; then
                  echo "::error::release lookup exceeded bounded pagination"
                  exit 1
                fi
              done
              match_count="$(wc -l <"$matches_json" | tr -d '[:space:]')"
              if [[ "$match_count" -gt 1 ]]; then
                echo "::error::expected exactly one release for tag $RELEASE_TAG; found $match_count"
                exit 1
              fi
              if [[ "$match_count" -eq 1 ]]; then
                break
              fi
              if [[ "$lookup_attempt" -lt "$max_release_lookup_attempts" ]]; then
                echo "Release $RELEASE_TAG is not visible yet; retrying exact lookup ($lookup_attempt/$max_release_lookup_attempts)." >&2
                sleep "$release_lookup_delay_seconds"
              fi
            done
            if [[ "$match_count" -ne 1 ]]; then
              echo "::error::expected exactly one release for tag $RELEASE_TAG after $max_release_lookup_attempts attempts; found $match_count"
              exit 1
            fi
            release_id="$(
              jq -er \
                '.id | select(type == "number" and . > 0 and floor == .) | tostring' \
                "$matches_json"
            )"
            [[ "$release_id" =~ ^[1-9][0-9]*$ ]] || {
              echo "::error::release lookup returned an invalid release ID"
              exit 1
            }
            gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" \
              >"$output_path"
            jq -e \
              --argjson id "$release_id" \
              --arg tag "$RELEASE_TAG" \
              '.id == $id and .tag_name == $tag' \
              "$output_path" >/dev/null
          }
          resolve_remote_release_tag() {
            local remote_refs tag_commit tag_object
            remote_refs="$(
              git -C index ls-remote --tags origin \
                "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}"
            )"
            tag_object="$(
              awk -v ref="refs/tags/$RELEASE_TAG" '$2 == ref { print $1 }' \
                <<<"$remote_refs"
            )"
            tag_commit="$(
              awk -v ref="refs/tags/$RELEASE_TAG^{}" '$2 == ref { print $1 }' \
                <<<"$remote_refs"
            )"
            if [[ -n "$tag_commit" ]]; then
              printf '%s\n' "$tag_commit"
            else
              printf '%s\n' "$tag_object"
            fi
          }
          release_json="$RUNNER_TEMP/verified-release.json"
          notes="$RUNNER_TEMP/expected-release-notes.md"
          printf '%s\n\n%s\n\n%s\n\n%s' \
            "ZTC $RELEASE_VERSION ($RELEASE_CHANNEL)." \
            "Built from immutable Epoch-ML/zerg source commit \`$SOURCE_SHA\`." \
            "The updater archive is signed independently from the macOS application signature." \
            "Bridge notice: ZTC-launched ZTC 0.1.2 sessions cannot complete this transition in-app. Install this release from the signed DMG once; automatic signed updates with session restoration resume from this release onward." \
            >"$notes"
          fetch_exact_release "$release_json"
          expected_prerelease=false
          if [[ "$RELEASE_CHANNEL" == "preview" ]]; then
            expected_prerelease=true
          fi
          jq -e \
            --arg tag "$RELEASE_TAG" \
            --arg title "ZTC $RELEASE_VERSION ($RELEASE_CHANNEL)" \
            --rawfile body "$notes" \
            --argjson prerelease "$expected_prerelease" \
            '.tag_name == $tag and
             .name == $title and
             .body == $body and
             .draft == false and
             .immutable == true and
             .prerelease == $prerelease' \
            "$release_json" >/dev/null
          tag_target="$(resolve_remote_release_tag)"
          if [[ "$tag_target" != "$RELEASE_TARGET_SHA" ]]; then
            echo "::error::release tag moved before publication"
            exit 1
          fi


          tag_target="$(resolve_remote_release_tag)"
          if [[ "$tag_target" != "$RELEASE_TARGET_SHA" ]]; then
            echo "::error::published release tag does not point to the immutable request commit"
            exit 1
          fi
          fetch_exact_release "$release_json"
          jq -e \
            --arg tag "$RELEASE_TAG" \
            --arg title "ZTC $RELEASE_VERSION ($RELEASE_CHANNEL)" \
            --rawfile body "$notes" \
            --argjson prerelease "$expected_prerelease" \
            '.tag_name == $tag and
             .name == $title and
             .body == $body and
             .draft == false and
             .immutable == true and
             .prerelease == $prerelease' \
            "$release_json" >/dev/null
          expected_assets=(
            ztc.app.tar.gz
            ztc.app.tar.gz.sig
            "ztc_${RELEASE_VERSION}_aarch64.dmg"
            checksums.txt
            latest.json
            release-metadata.json
            release.json
            release.json.sig
          )
          if [[ "$(jq '.assets | length' "$release_json")" -ne "${#expected_assets[@]}" ]]; then
            echo "::error::published release must contain exactly eight canonical assets"
            exit 1
          fi
          if [[ -e verified-release ]]; then
            echo "::error::canonical verified-release directory already exists"
            exit 1
          fi
          mkdir verified-release
          max_binary_bytes=$((512 * 1024 * 1024))
          max_json_bytes=$((1024 * 1024))
          max_text_bytes=$((64 * 1024))
          max_total_bytes=$((1024 * 1024 * 1024))
          total_asset_bytes=0
          for asset_name in "${expected_assets[@]}"; do
            asset_url="$(
              jq -er --arg name "$asset_name" \
                'if ([.assets[] | select(.name == $name)] | length) == 1
                 then .assets[] | select(.name == $name) | .browser_download_url
                 else error("asset set is not exact")
                 end' "$release_json"
            )"
            asset_size="$(
              jq -er --arg name "$asset_name" \
                'if ([.assets[] | select(.name == $name)] | length) == 1
                 then .assets[] | select(.name == $name) |
                   .size | select(type == "number" and . > 0 and floor == .) |
                   tostring
                 else error("asset set is not exact")
                 end' "$release_json"
            )"
            case "$asset_name" in
              ztc.app.tar.gz|ztc_*_aarch64.dmg)
                maximum_bytes="$max_binary_bytes"
                ;;
              ztc.app.tar.gz.sig|release.json.sig|checksums.txt)
                maximum_bytes="$max_text_bytes"
                ;;
              latest.json|release-metadata.json|release.json)
                maximum_bytes="$max_json_bytes"
                ;;
              *)
                echo "::error::unexpected canonical asset name: $asset_name"
                exit 1
                ;;
            esac
            if [[ "$asset_size" -gt "$maximum_bytes" ]]; then
              echo "::error::$asset_name exceeds its verification size bound"
              exit 1
            fi
            total_asset_bytes=$((total_asset_bytes + asset_size))
            if [[ "$total_asset_bytes" -ge "$max_total_bytes" ]]; then
              echo "::error::canonical asset set reaches its total size bound"
              exit 1
            fi
            node index/scripts/release-asset-url.mjs \
              "$asset_url" "$GITHUB_REPOSITORY" "$RELEASE_TAG" "$asset_name" \
              >/dev/null
            canonical_path="verified-release/$asset_name"
            curl --fail --location --retry 5 --retry-all-errors \
              --proto '=https' --proto-redir '=https' --tlsv1.2 \
              --max-filesize "$maximum_bytes" --silent --show-error \
              "$asset_url" --output "$canonical_path"

          done

          node index/scripts/verify-release-payload.mjs \
            verified-release \
            "$release_json" \
            "index/requests/${RELEASE_TAG}.json" \
            "$GITHUB_REPOSITORY"
          (cd verified-release && sha256sum -c checksums.txt)
          openssl base64 -d -A \
            -in verified-release/ztc.app.tar.gz.sig \
            -out "$RUNNER_TEMP/updater.sig"
          tagged_public_key="$RUNNER_TEMP/tagged-updater.pubkey"
          git -C index show \
            "${RELEASE_TARGET_SHA}:updater-${RELEASE_CHANNEL}.pubkey" \
            >"$tagged_public_key"
          [[ -s "$tagged_public_key" ]]
          openssl base64 -d -A \
            -in "$tagged_public_key" \
            -out "$RUNNER_TEMP/updater.pubkey"
          minisign -Vm verified-release/release.json -x <(openssl base64 -d -A -in verified-release/release.json.sig) -p "$RUNNER_TEMP/updater.pubkey"
          minisign -Vm verified-release/ztc.app.tar.gz \
            -x "$RUNNER_TEMP/updater.sig" \
            -p "$RUNNER_TEMP/updater.pubkey"

          python3 - verified-release/ztc.app.tar.gz "$RELEASE_CHANNEL" <<'PY'
          import struct
          import sys
          import tarfile

          expected = {
              "ztc.app": "directory",
              "ztc.app/Contents": "directory",
              "ztc.app/Contents/_CodeSignature": "directory",
              "ztc.app/Contents/MacOS": "directory",
              "ztc.app/Contents/Info.plist": "file",
              "ztc.app/Contents/PkgInfo": "file",
              "ztc.app/Contents/MacOS/ZTerm": "file",
              "ztc.app/Contents/_CodeSignature/CodeResources": "file",
          }
          expected["ztc.app/Contents/CodeResources"] = "file"
          max_member_bytes = 512 * 1024 * 1024
          max_expanded_bytes = 1024 * 1024 * 1024
          executable_name = "ztc.app/Contents/MacOS/ZTerm"
          executable_header = None
          with tarfile.open(sys.argv[1], "r:gz") as archive:
              actual = {}
              expanded_bytes = 0
              for member in archive:
                  if len(actual) >= 32768:
                      raise SystemExit("archive contains too many members")
                  if member.name in actual:
                      raise SystemExit(f"duplicate archive member: {member.name}")
                  if member.isdir():
                      kind = "directory"
                  elif member.isfile():
                      kind = "file"
                      if member.size > max_member_bytes:
                          raise SystemExit(
                              f"archive member exceeds size bound: {member.name}"
                          )
                      expanded_bytes += member.size
                      if expanded_bytes > max_expanded_bytes:
                          raise SystemExit("archive exceeds expanded-size bound")
                      if member.name == executable_name:
                          executable = archive.extractfile(member)
                          if executable is None:
                              raise SystemExit("archive executable cannot be read")
                          executable_header = executable.read(8)
                  else:
                      raise SystemExit(
                          f"unsafe archive member type: {member.name}"
                      )
                  actual[member.name] = kind
          if any(actual.get(name) != kind for name, kind in expected.items()):
              raise SystemExit("archive is missing a required bundle entry")
          for name in actual:
              if name not in expected and not name.startswith("ztc.app/Contents/Resources/") and name != "ztc.app/Contents/Resources":
                  raise SystemExit(f"unexpected archive member: {name}")
          if len(executable_header or b"") != 8:
              raise SystemExit("archive executable Mach-O header is incomplete")
          magic, cpu_type = struct.unpack("<II", executable_header)
          if magic != 0xFEEDFACF or cpu_type != 0x0100000C:
              raise SystemExit(
                  "archive executable Mach-O architecture must be 64-bit arm64"
              )
          PY
          extract_dir="$RUNNER_TEMP/canonical-zterm-app"
          mkdir "$extract_dir"
          tar \
            --extract \
            --gzip \
            --file verified-release/ztc.app.tar.gz \
            --directory "$extract_dir" \
            --no-same-owner \
            --no-same-permissions
          unsafe_path="$(
            find "$extract_dir" ! -type d ! -type f -print -quit
          )"
          [[ -z "$unsafe_path" ]]
          [[ -s "$extract_dir/ztc.app/Contents/CodeResources" ]]
          node index/scripts/inspect-bundle.mjs "$extract_dir/ztc.app" "$RELEASE_VERSION" "$SOURCE_SHA" > /dev/null
          app="$extract_dir/ztc.app"
          executable="$app/Contents/MacOS/ZTerm"
          [[ -x "$executable" && -f "$executable" && ! -L "$executable" ]]
          printf 'APPL????' | cmp - "$app/Contents/PkgInfo"
          [[ -s "$app/Contents/_CodeSignature/CodeResources" ]]
          expected_bundle_version="${RELEASE_VERSION%%[-+]*}"
          python3 - "$app/Contents/Info.plist" "$expected_bundle_version" <<'PY'
          import plistlib
          import sys

          with open(sys.argv[1], "rb") as plist_file:
              info = plistlib.load(plist_file)
          expected = {
              "CFBundleDisplayName": "ZTC",
              "CFBundleExecutable": "ZTerm",
              "CFBundleIdentifier": "dev.zerg.zterm",
              "CFBundleName": "ZTC",
              "CFBundlePackageType": "APPL",
              "CFBundleShortVersionString": sys.argv[2],
              "CFBundleVersion": sys.argv[2],
              "LSMinimumSystemVersion": "12.0",
              "NSHighResolutionCapable": True,
          }
          expected["CFBundleIconFile"] = "AppIcon"
          if info != expected:
              raise SystemExit(f"Info.plist contract mismatch: {info!r}")
          PY

          tag_target="$(resolve_remote_release_tag)"
          if [[ "$tag_target" != "$RELEASE_TARGET_SHA" ]]; then
            echo "::error::release tag moved during canonical asset verification"
            exit 1
          fi

      - name: Upload canonical verified release payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-release
          path: verified-release/
          if-no-files-found: error
          retention-days: 14

  promote-feed:
    name: Promote monotonic updater feed on release-data
    needs:
      - validate
      - verify-artifacts
    runs-on: ubuntu-24.04
    environment: zterm-feed
    permissions:
      contents: write
    outputs:
      pages_artifact_id: ${{ steps.pages-artifact.outputs.artifact-id }}
    env:
      RELEASE_CHANNEL: ${{ needs.validate.outputs.channel }}
      RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: policy
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          path: data
          ref: main
          token: ${{ github.token }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.23.2"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-release
          path: payload

      - name: Prepare isolated release-data branch
        shell: bash
        run: |
          set -euo pipefail
          set +e
          git -C data ls-remote --exit-code --heads origin refs/heads/release-data >"$RUNNER_TEMP/release-data-ref"
          lookup_status=$?
          set -e
          case "$lookup_status" in
            0)
              git -C data fetch origin release-data
              git -C data checkout -B release-data FETCH_HEAD
              echo 'RELEASE_DATA_EXISTS=true' >>"$GITHUB_ENV"
              ;;
            2)
              git -C data checkout --orphan release-data
              git -C data rm -rf .
              mkdir -p data/site
              cp -R policy/site/. data/site/
              git -C data add site
              echo 'RELEASE_DATA_EXISTS=false' >>"$GITHUB_ENV"
              ;;
            *)
              echo '::error::Unable to read release-data ref; refusing to reset feed history' >&2
              exit "$lookup_status"
              ;;
          esac

      - name: Require installer and Homebrew readiness before activation
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --proto '=https' --proto-redir '=https' --max-time 30 https://zergai.com/install/ztc.sh -o "$RUNNER_TEMP/install-ztc.sh"
          cmp "$RUNNER_TEMP/install-ztc.sh" policy/install-ztc.sh
          curl --fail --location --proto '=https' --proto-redir '=https' --max-time 30 https://raw.githubusercontent.com/Epoch-ML/homebrew-tap/main/Formula/ztc.rb -o "$RUNNER_TEMP/ztc.rb"
          node policy/scripts/check-install-readiness.mjs payload/release.json "$RUNNER_TEMP/ztc.rb"

      - name: Commit updater manifest after asset verification
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RELEASE_DATA_EXISTS" == true ]]; then
            git -C data pull --ff-only origin release-data
          fi
          latest_path="data/site/$RELEASE_CHANNEL/latest.json"
          metadata_path="data/site/$RELEASE_CHANNEL/releases/$RELEASE_VERSION.json"
          mkdir -p "$(dirname "$metadata_path")"
          node policy/scripts/feed-policy.mjs \
            "$latest_path" payload/latest.json \
            "$metadata_path" payload/release-metadata.json
          cp payload/latest.json "$latest_path"
          cp payload/release.json "data/site/$RELEASE_CHANNEL/release.json"
          cp payload/release.json.sig "data/site/$RELEASE_CHANNEL/release.json.sig"
          cp payload/release-metadata.json "$metadata_path"
          git -C data config user.name "github-actions[bot]"
          git -C data config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git -C data add \
            "site/$RELEASE_CHANNEL/latest.json" \
            "site/$RELEASE_CHANNEL/release.json" \
            "site/$RELEASE_CHANNEL/release.json.sig" \
            "site/$RELEASE_CHANNEL/releases/$RELEASE_VERSION.json"
          if git -C data diff --cached --quiet; then
            echo "The identical updater manifest is already published."
          else
            git -C data commit -m "Publish $RELEASE_TAG updater manifest"
            git -C data push origin HEAD:release-data
          fi

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Create deterministic Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          unsafe_path="$(
            find data/site \
              ! -type f \
              ! -type d \
              -print -quit
          )"
          if [[ -n "$unsafe_path" ]]; then
            printf \
              '::error::Pages site contains a symlink or special file: %q\n' \
              "$unsafe_path"
            exit 1
          fi
          tar \
            --dereference \
            --hard-dereference \
            --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            --directory data/site \
            --create \
            --verbose \
            --file "$RUNNER_TEMP/artifact.tar" \
            --exclude=.git \
            --exclude=.github \
            .
          [[ -s "$RUNNER_TEMP/artifact.tar" ]]

      - name: Upload pinned Pages artifact
        id: pages-artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy-pages:
    name: Deploy verified updater site
    needs: promote-feed
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.23.2"

      - id: deployment
        name: Deploy Pages without cancelling a recoverable queue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_ID: ${{ needs.promote-feed.outputs.pages_artifact_id }}
          PAGES_DEPLOY_TIMEOUT_MS: "1800000"
        run: node scripts/deploy-pages.mjs

  verify-pages:
    name: Verify the exact deployed updater feed over HTTPS
    needs:
      - validate
      - verify-artifacts
      - deploy-pages
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      RELEASE_CHANNEL: ${{ needs.validate.outputs.channel }}
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-release
          path: payload

      - name: Verify the published channel manifest over HTTPS
        shell: bash
        run: |
          set -euo pipefail
          pages_root="https://epoch-ml.github.io/ztc-releases"
          deployed_root="${{ needs.deploy-pages.outputs.page_url }}"
          [[ "$deployed_root" == "$pages_root/" ]]
          cache_key="run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          encoded_version="$(
            node -e 'process.stdout.write(encodeURIComponent(process.argv[1]))' \
              "$RELEASE_VERSION"
          )"
          curl --fail --location --retry 12 --retry-all-errors --retry-delay 5 \
            --proto '=https' --tlsv1.2 --silent --show-error \
            "$pages_root/$RELEASE_CHANNEL/latest.json?$cache_key" \
            --output "$RUNNER_TEMP/live-latest.json"
          cmp --silent payload/latest.json "$RUNNER_TEMP/live-latest.json"
          curl --fail --location --retry 12 --retry-all-errors --retry-delay 5 \
            --proto '=https' --tlsv1.2 --silent --show-error \
            "$pages_root/$RELEASE_CHANNEL/releases/$encoded_version.json?$cache_key" \
            --output "$RUNNER_TEMP/live-release-metadata.json"
          cmp --silent payload/release-metadata.json \
            "$RUNNER_TEMP/live-release-metadata.json"
          curl --fail --location --retry 12 --retry-all-errors --retry-delay 5 \
            --proto '=https' --tlsv1.2 --silent --show-error \
            "$pages_root/$RELEASE_CHANNEL/release.json?$cache_key" \
            --output "$RUNNER_TEMP/live-public-release.json"
          cmp --silent payload/release.json "$RUNNER_TEMP/live-public-release.json"
          curl --fail --location --retry 12 --retry-all-errors --retry-delay 5 \
            --proto '=https' --tlsv1.2 --silent --show-error \
            "$pages_root/$RELEASE_CHANNEL/release.json.sig?$cache_key" \
            --output "$RUNNER_TEMP/live-public-release.json.sig"
          cmp --silent payload/release.json.sig "$RUNNER_TEMP/live-public-release.json.sig"
